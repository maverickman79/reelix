# Development override that publishes PostgreSQL on loopback.
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
#
# The canonical stack in docker-compose.yml deliberately publishes no host
# port for the database — only the app container needs it. Integration tests
# run on the host, so they need a way in.
#
# The binding is 127.0.0.1, not the Tailscale address used for the application
# port and not 0.0.0.0. The database is reachable from this machine only; it is
# not exposed to the tailnet, and certainly not to the internet.
#
# Development brings the stack up with this override by default:
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
#
# Plain `docker compose up -d` reverts Postgres to publishing no host port,
# which silently breaks the integration tests.
#
# Do not merge this into the canonical stack, and never use it in a
# deployment. docker-compose.yml on its own remains the deployable article.

services:
  postgres:
    ports:
      - "127.0.0.1:${REELIX_DB_HOST_PORT:-5432}:5432"
