# One origin, two backends.
#
# THIS IS WHY THE STACK EXISTS. jellyfin-web is a browser client, so pointing
# it at Reelix from a different origin means the browser enforces CORS on every
# request — and Reelix sends no CORS headers, while its WebSocket handler
# verifies Origin on purpose (see internal/compat/jellyfin/socket.go). Making
# cross-origin work would mean adding CORS middleware AND relaxing a deliberate
# security check, in production code, to accommodate a test client.
#
# Serving both halves behind one origin removes the question entirely, and it
# is what a real Jellyfin deployment looks like to a browser: the server hands
# out the web client at /web/ and answers the API at the root. Reelix is
# unchanged.
server {
    listen 80;

    # The static bundle. Reelix never sees these paths, which is correct —
    # they are assets, not API surface, and were excluded from the fixtures in
    # Step 6 for that reason.
    location /web/ {
        alias /usr/share/nginx/html/web/;
        try_files $uri $uri/ /web/index.html;
    }

    location = / {
        return 302 /web/;
    }

    # Everything else is Reelix.
    location / {
        proxy_pass ${REELIX_UPSTREAM};
        proxy_http_version 1.1;

        # $http_host, not $host: $host drops the port, and Reelix builds
        # LocalAddress from the Host header. A client told the server lives at
        # http://<addr> with no port would dial 80 and find nginx's default.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /socket is a WebSocket. Without these it fails the upgrade and the
        # client falls back to polling, which hides socket faults rather than
        # surfacing them.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A 76GB file is streamed through here. Buffering it would put the
        # whole response in a temp file before a byte reached the browser.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
